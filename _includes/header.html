<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand__mark" aria-hidden="true">SR</span>
      <span class="brand__name">Samuel Ryoo</span>
    </a>
    <nav class="nav" aria-label="Primary">
      <ul>
        {%- for item in site.data.nav %}
        {%- assign first_seg = page.url | split: "/" | slice: 1 | first -%}
        {%- assign item_seg = item.url | split: "/" | slice: 1 | first -%}
        <li><a href="{{ item.url | relative_url }}"{% if first_seg == item_seg %} aria-current="page"{% endif %}>{{ item.label }}</a></li>
        {%- endfor %}
      </ul>
    </nav>
  </div>
</header>
