- org: Refined Robotics
  role: Hardware Engineering Intern
  dates: Jun – Sep 2026
  location: Tokyo, Japan
  section: work
  summary: Electrical and embedded work on the sensor and compute payload of an autonomous delivery robot.
  points:
    - Re-architected payload power into isolated compute and actuator rails, each sized to its load budget, to keep motor switching noise off the sensors and cameras.
    - Designed a 2-layer power distribution PCB in KiCad feeding five subsystems. Passed ERC and DRC with zero violations and released it for fabrication and assembly.
    - Designed a second-revision board that measures every output branch with Kelvin shunts and INA3221 monitors, collected by an STM32G031 over I²C and reported to the host over UART.
    - Replaced an open-loop servo mechanism with three stepper axes. Selected the NEMA17 motors and DRV8825 drivers and wrote the Arduino firmware that generates their STEP/DIR pulses.
    - Integrated LiDAR, stereo cameras, GNSS, and the onboard Jetson computer at the hardware level, including Ethernet, USB, and GMSL2 links and the harness.
  project: delivery-robot-payload

- org: ZotBotics at UCI
